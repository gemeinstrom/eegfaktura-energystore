# gemeinstrom-Fork-Variante des upstream-Workflows (eegfaktura/*).
# Delta zum Upstream (bei jedem Upstream-Sync neu anwenden):
#   - Push nach ghcr.io/gemeinstrom/* statt ghcr.io/vfeeg-development/*
#   - Registry-Login mit GITHUB_TOKEN statt VFEEG_DEV_PUSH_PAT (same-org push)
#   - dispatch-*-Jobs zum Platform-Repo in vfeeg-development entfernt, kein env/**-Trigger
# Die Kommentare unterhalb stammen aus dem Upstream und beschreiben dessen Ziel-Org.

# Voll-Pipeline (Build + Push + dispatch-deploy) fuer eegfaktura-energystore.
# Pusht ins Development-Tier ghcr.io/vfeeg-development/eegfaktura-energystore
# gemaess ADR-0005 (Two-Tier-Image-Registry) im Platform-Repo.
#
# Build-Flow:
#   1. Checkout
#   2. Go-Setup + protoc-Codegen (scripts/dev/generate.sh), Tests mit -race,
#      Coverage-Untergrenzen, gofmt/vet (M0 des Testumgebungs-Plans)
#   3. docker/login-action mit VFEEG_DEV_PUSH_PAT (Cross-Org-Push)
#   4. docker/build-push-action -> ghcr.io/vfeeg-development/eegfaktura-energystore
#   5. Build-Provenance-Attestation
#   6. repository_dispatch deploy-energystore an Platform-Repo
#
# Vorbedingungen:
#   - VFEEG_DEV_PUSH_PAT-Secret im Repo (Classic PAT, write:packages auf
#     vfeeg-development, 90-Tage-Expiry)
#   - PLATFORM_DEPLOY_PAT-Secret (fuer dispatch-Trigger)
#   - K8s-Manifest k8s/50-energystore.yaml im Platform-Repo zeigt auf
#     ghcr.io/vfeeg-development/eegfaktura-energystore:latest
#   - deploy-on-dispatch.yml im Platform-Repo akzeptiert `deploy-energystore`

name: Docker Image CI

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
    tags:
      - v*
    # a commit that only changes the CHANGELOG (release PR) builds no image; the release promotes the image of the
    # commit before (platform#239). Tag pushes still build: path filters do not apply to tags.
    paths-ignore: ['CHANGELOG.md']
  # ready_for_review: a draft gets no image build; it runs once the PR is marked ready
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - main
    # a pull request that only changes the CHANGELOG (release PR) builds no image either (platform#239)
    paths-ignore: ['CHANGELOG.md']

env:
  REGISTRY: "ghcr.io"
  # Image landet im Development-Tier (vfeeg-development), nicht im Release-Tier
  # (eegfaktura). Siehe ADR-0005 im Platform-Repo. Repo-Name bleibt dynamisch,
  # damit das Template ohne Aenderung in andere Source-Repos uebernehmbar ist.
  IMAGE_NAME: gemeinstrom/${{ github.event.repository.name }}

jobs:
  build-and-push-image:
    # pull requests: not while a draft (pr-checks.yml tests drafts)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go (for protoc plugins)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Install protoc + Go gRPC plugins (pinned, scripts/dev/generate.sh)
        run: |
          set -eu
          # Versions as in scripts/dev/generate.sh (known-errors #1, #10); the release zip is checked by SHA-256.
          curl -sSfL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/opt/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/opt/protoc"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/opt/protoc/bin" >> "$GITHUB_PATH"

      - name: Generated code is up to date
        run: |
          bash scripts/dev/generate.sh
          git diff --exit-code protoc/

      # Tests gate the image (M0): a red test, a race, a format or vet finding or a package
      # below its coverage floor stops the job before anything is built or pushed. The root package (two func main) is left out, #1.
      - name: Format and vet
        run: bash scripts/dev/static-check.sh

      - name: Go tests (race detector, coverage)
        env:
          TZ: UTC   # the tests fix Europe/Vienna themselves (TestMain); UTC proves it
        run: bash scripts/dev/test.sh

      - name: Coverage floors
        run: |
          bash scripts/dev/coverage-check.sh cover.out
          go tool cover -html=cover.out -o coverage.html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            cover.out
            coverage.html
          if-no-files-found: ignore

      - name: govulncheck (reporting only)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck $(bash scripts/dev/packages.sh)

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title="eegfaktura-energystore"
            org.opencontainers.image.description="EEG Faktura energy store - holds the energy data of renewable communities (Go)"
            org.opencontainers.image.source=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.url=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.version=${{ github.sha || '' }}
            org.opencontainers.image.revision=${{ github.sha || '' }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}
            org.opencontainers.image.authors="eegfaktura@vfeeg.org"
            org.opencontainers.image.vendor="Verein zur Förderung von Erneuerbaren Energiegemeinschaften"
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id || '' }}
            org.opencontainers.image.ref.name=${{ github.ref || '' }}
            org.opencontainers.image.ref.sha=${{ github.sha || '' }}
            org.opencontainers.image.repository=${{ github.repository || '' }}

      - name: Login to Container Registry
        # Push cross-org nach vfeeg-development/* — GITHUB_TOKEN reicht dafuer
        # nicht (scope ist auf den source-repo beschraenkt). Nutzen den Classic-PAT
        # VFEEG_DEV_PUSH_PAT (write:packages auf vfeeg-development, 90-Tage-Expiry).
        # GHCR validiert via Token, nicht via username — github.actor bleibt.
        # Pull-Requests duerfen nicht pushen, daher Login-Step nur bei push-event.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR) / Build and push (push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags || 'latest' }}
          labels: ${{ steps.meta.outputs.labels || '' }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # service.version in the JSON log lines (internal/logging)
          # service.version in the log identifies the BUILD: the version for a tag build, else the commit (a branch
          # name cannot tell builds apart). Prod/pilot images are re-tagged dev-tier digests (gitops promote-image.yml,
          # no rebuild), so the release version of a running image is its tag, not this value.
          build-args: |
            SERVICE_VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || github.sha }}

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
