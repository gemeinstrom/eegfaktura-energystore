# gemeinstrom-Fork-Variante des upstream docker-image-Workflows.
# Delta zum Upstream (eegfaktura/eegfaktura-energystore):
#   - Push nach ghcr.io/gemeinstrom/<repo-name> statt ghcr.io/vfeeg-development/<repo-name>
#   - GITHUB_TOKEN statt VFEEG_DEV_PUSH_PAT (same-org push)
#   - dispatch-deploy Jobs entfernt (kein Deploy-Dispatch in fremde Orgs)
# Aufgesetzt 2026-10-04 (Fork-Neuanlage energystore).

name: Docker Image CI

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
      - 'env/**'
    tags:
      - v*
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: gemeinstrom/${{ github.event.repository.name }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go (for protoc plugins)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install protoc + Go gRPC plugins
        run: |
          set -eu
          # Reproduziert den `make protoc`-Schritt aus dem Makefile.
          # Generierte Files (z.B. protoc/masterdata.pb.go) sind im Repo
          # nicht committet (nur protoc/excel.pb.go) — Devs lassen das
          # lokal vor `make docker` laufen. CI muss das selbst tun.
          # GitHub-Runner haben das Microsoft-azure-cli-Repo vorinstalliert, das
          # zeitweise 403 liefert. Wir brauchen es fuer protobuf-compiler nicht —
          # vor `apt-get update` raus, damit echte Fehler nicht maskiert werden.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run protoc codegen
        run: |
          set -eu
          export PATH="$HOME/go/bin:$PATH"
          protoc --experimental_allow_proto3_optional=true \
            --proto_path=. \
            --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            ./protoc/*.proto
          ls -la protoc/

      # Bis hierher pruefte die Pipeline nur, ob das Image *baut* — ein gruener
      # Check bedeutete "kompiliert", nicht "Tests bestehen". Eine Regression in
      # der Perioden-Metadaten-Logik (PR #26) lief so an einem gruenen Check
      # vorbei, obwohl ein vorhandener Test sie abgefangen haette.
      #
      # Bewusst KEIN `go test ./...`: auf main sind ./calculation (haengt,
      # Timeout), ./model, ./mqttclient und ./store/ebow schon rot (Badger-Disk,
      # Wire-Format-Fixtures). Die Liste deckt die Pakete ab, die auf main
      # zuverlaessig gruen sind — sie ist als Untergrenze gedacht und gehoert
      # erweitert, sobald die uebrigen Pakete repariert sind.
      - name: Run Go tests (gruene Pakete)
        run: go test -count=1 ./utils/ ./store/ ./store/function/ ./excel/ ./tenantctx/ ./graph/

      # store/ebow bleibt oben draussen (vorhandener Test "Test" rot), die Tests des
      # Value-Log-Aufraeumens laufen hier gefiltert mit echtem Badger.
      - name: Run Go tests (vlog GC, echter Badger)
        run: go test -count=1 -run TestVlogGC ./store/ebow/

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title="eegfaktura-energystore"
            org.opencontainers.image.description="EEG Faktura energy store - holds the energy data of renewable communities (Go)"
            org.opencontainers.image.source=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.url=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.version=${{ github.sha || '' }}
            org.opencontainers.image.revision=${{ github.sha || '' }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}
            org.opencontainers.image.authors="eegfaktura@vfeeg.org"
            org.opencontainers.image.vendor="Verein zur Förderung von Erneuerbaren Energiegemeinschaften"
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id || '' }}
            org.opencontainers.image.ref.name=${{ github.ref || '' }}
            org.opencontainers.image.ref.sha=${{ github.sha || '' }}
            org.opencontainers.image.repository=${{ github.repository || '' }}

      - name: Login to Container Registry
        # Same-Org push nach ghcr.io/gemeinstrom/* — GITHUB_TOKEN reicht.
        # Pull-Requests duerfen nicht pushen, daher Login-Step nur bei push-event.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR) / Build and push (push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags || 'latest' }}
          labels: ${{ steps.meta.outputs.labels || '' }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
